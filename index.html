<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Birthday Party</title>
<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  height:100vh;
  margin:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{color:#fff;font-size:40px;z-index:2}

#cakeArea{
  position:relative;
  font-size:120px;
  z-index:2;
}

#cake{
  position:relative;
}

#knife{
  position:absolute;
  font-size:50px;
  pointer-events:none;
  display:none;
  transform:translate(-50%,-50%);
}

#smoke{
  position:absolute;
  top:-40px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  opacity:0;
}

.smokeAnim{
  animation:smokeRise 2s ease-out forwards;
}

@keyframes smokeRise{
  0%{opacity:0; transform:translate(-50%,10px) scale(0.5);} 
  20%{opacity:1;} 
  100%{opacity:0; transform:translate(-50%,-60px) scale(1.3);} 
}

#sliceLine{
  position:absolute;
  top:10px;
  left:50%;
  width:4px;
  height:0px;
  background:white;
  transform:translateX(-50%);
  display:none;
}

#message{
  margin-top:20px;
  font-size:30px;
  color:white;
  display:none;
}

button{
  margin-top:20px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<h1>🎉 Hina's Birthday Party 🎉</h1>
<audio id="birthdaySong" preload="auto">
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>
<h2 style="color:white;margin-top:-10px">15th March</h2>
<div id="countdown" style="color:white;font-size:22px;margin-top:10px"></div>

<div id="cakeArea">
  <div id="cake">🎂🕯🕯🕯</div>
  <div id="smoke">💨💨💨</div>
  <div id="sliceLine"></div>
</div>

<div id="knife">🔪</div>

<div id="message">🎊 Cake Cut! Happy Birthday! 🎊</div>

<button onclick="blowCandles()" id="blowBtn" style="display:none">Blow Candles</button>
<button onclick="cutCake()" id="cutBtn" style="display:none">Cut the Cake</button>

<script>
// countdown to 15 March (midnight IST approx)
const countdownEl = document.getElementById("countdown");
const targetDate = new Date("2026-03-15T00:00:00");

function updateCountdown(){
 const now = new Date();
 const diff = targetDate - now;

 if(diff <= 0){
   countdownEl.innerHTML = "🎉 It's Hina's Birthday! You can cut the cake now!";
   document.getElementById("blowBtn").style.display = "inline-block";
   document.getElementById("cutBtn").style.display = "inline-block";
   return;
 }

 const days = Math.floor(diff/(1000*60*60*24));
 const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
 const minutes = Math.floor((diff%(1000*60*60))/(1000*60));
 const seconds = Math.floor((diff%(1000*60))/1000);

 countdownEl.innerHTML = `⏳ Birthday Countdown: ${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCountdown,1000);
updateCountdown();

const cake = document.getElementById("cake");
const knife = document.getElementById("knife");
const smoke = document.getElementById("smoke");
const sliceLine = document.getElementById("sliceLine");

let candlesBlown = false;
let cakeCut = false;

const cakeArea = document.getElementById("cakeArea");

cakeArea.addEventListener("mouseenter",()=>{
 if(candlesBlown && !cakeCut) knife.style.display="block";
});

cakeArea.addEventListener("mouseleave",()=>{
 if(!cakeCut) knife.style.display="none";
});

cakeArea.addEventListener("mousemove",(e)=>{
 knife.style.left = e.pageX+"px";
 knife.style.top = e.pageY+"px";
});

function blowCandles(){
 cake.textContent = "🎂";
 candlesBlown = true;

 smoke.style.opacity = "1";
 smoke.classList.add("smokeAnim");

 setTimeout(()=>{
   smoke.style.opacity = "0";
   smoke.classList.remove("smokeAnim");
 },2000);

 document.getElementById("cutBtn").disabled = false;
 document.getElementById("blowBtn").disabled = true;
}

function sliceAnimation(){
 sliceLine.style.display="block";
 let h=0;
 const interval=setInterval(()=>{
   h+=8;
   sliceLine.style.height=h+"px";
   if(h>120){
     clearInterval(interval);
   }
 },20);
}

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let confettiPieces=[];

function createConfetti(){
 for(let i=0;i<150;i++){
  confettiPieces.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height-canvas.height,
   r:Math.random()*6+2,
   d:Math.random()*50
  });
 }
}

function drawConfetti(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="white";
 ctx.beginPath();

 for(let i=0;i<confettiPieces.length;i++){
  let p=confettiPieces[i];
  ctx.moveTo(p.x,p.y);
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2,true);
 }

 ctx.fill();
 updateConfetti();
}

let angle=0;

function updateConfetti(){
 angle+=0.01;

 for(let i=0;i<confettiPieces.length;i++){
  let p=confettiPieces[i];
  p.y+=Math.cos(angle+p.d)+2+p.r/2;
  p.x+=Math.sin(angle);

  if(p.y>canvas.height){
   p.y=-10;
   p.x=Math.random()*canvas.width;
  }
 }
}

function animateConfetti(){
 drawConfetti();
 requestAnimationFrame(animateConfetti);
}

function cutCake(){
 if(!candlesBlown) return;

 cakeCut=true;
 knife.style.display="none";

 sliceAnimation();

 setTimeout(()=>{
   cake.textContent="🍰";

   document.getElementById("message").style.display="block";

   document.getElementById('birthdaySong').play();

   createConfetti();
   animateConfetti();
 },800);
}

</script>

</body>
</html>
